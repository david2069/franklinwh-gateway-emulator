[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "franklinwh-gateway-emulator"
version = "0.2.3"
description = "FranklinWH aGate emulator — Modbus TCP (SunSpec + extension registers), multi-gateway"
readme = "README.md"
license = "MIT"
authors = [{name = "david2069", email = "david2069@users.noreply.github.com"}]
requires-python = ">=3.10"
dependencies = [
    "pysunspec2>=1.1.0",
    "pyyaml>=6.0",
    "tzdata; platform_system == 'Windows'",   # IANA zones where the OS has none
    "franklinwh-direct-connect-api>=0.4.0",   # every aGate runs a Direct Connect listener (#40)
]
keywords = ["franklinwh", "agate", "modbus", "sunspec", "emulator", "simulator"]

[project.optional-dependencies]
dc = ["franklinwh-direct-connect-api>=0.4.0"]
docs = ["mkdocs-material"]
pvlib = ["pvlib>=0.11"]
dev = [
    "franklinwh-direct-connect-api>=0.4.0",
    "pvlib>=0.11",
    "pytest>=7.0",
    "pymodbus>=3.6",
    "franklinwh-modbus @ git+https://github.com/david2069/franklinwh-modbus.git@38a80f8b3f24e573f5ee3c5c0bca3e0526d4566b",  # v0.11.0: ships firmware_quirks.json
]

[project.scripts]
franklinwh-emulator = "franklinwh_emulator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
franklinwh_emulator = ["baselines/*.json", "scenarios/*.yaml", "weather_data/open-meteo/*.json",
                       "ui/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
