<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FranklinWH Emulator</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/app.js"></script>
<script src="/static/diagram.js"></script>
<script src="/static/actions.js"></script>
<script src="/static/tou.js"></script>
<script src="/static/groups.js"></script>
<script src="/static/units.js"></script>
<script defer src="/static/alpinejs-3.14.1.min.js"></script>
</head>
<body x-data="running()" x-init="start()">
<header>
  <h1>FranklinWH Emulator</h1>
  <span class="version" x-show="version" x-text="versionText()"></span>
  <span class="meta" x-text="gateways.length + (gateways.length === 1 ? ' gateway' : ' gateways') + ' · emulated, not real devices'"></span>
  <form class="session" @submit.prevent="saveSession()" aria-label="Save or restore the setup">
    <label class="vh" for="save-name">Session name</label>
    <input id="save-name" type="text" x-model="saveName" placeholder="name (optional)" autocomplete="off">
    <button type="submit">Save</button>
    <label class="vh" for="restore-name">Saved session</label>
    <select id="restore-name" x-model="restoreName" :disabled="!sessionsList.length">
      <option value="" x-show="!sessionsList.length">no saved sessions</option>
      <template x-for="s in sessionsList" :key="s.name"><option :value="s.name" x-text="s.name"></option></template>
    </select>
    <button type="button" class="secondary" @click="restoreSession()" :disabled="!restoreName">Restore</button>
  </form>
  <div class="view-opts">
    <label for="group-by">Group by</label>
    <select id="group-by" :value="groupBy" @change="setView('groupBy', $event.target.value)">
      <template x-for="[v, l] in Object.entries(GROUP_BY)" :key="v"><option :value="v" x-text="l" :selected="v === groupBy"></option></template>
    </select>
    <button type="button" @click="setView('tempUnit', tempUnit === 'C' ? 'F' : 'C')"
            :title="'Show temperatures in ' + (tempUnit === 'C' ? '°F' : '°C') + ' (the emulator stays metric)'"
            x-text="tempUnit === 'C' ? '°C' : '°F'" aria-label="Temperature unit"></button>
    <button type="button" @click="setView('compact', !compact)" :aria-pressed="compact.toString()"
            title="Compact cards: SoC, local time and tags only">Compact</button>
  </div>
  <a class="docs-link" :href="docsUrl('')" target="_blank" rel="noopener" title="The emulator's documentation (opens a new tab)">Docs</a>
  <button type="button" class="layout-toggle" @click="toggleLayout()" :aria-pressed="(layout === 'right').toString()"
          x-text="layout === 'right' ? 'Actions: right' : 'Actions: below'"
          title="Show the actions beside the gateways, or below them"></button>
</header>
<main :class="'layout-' + layout">
  <p class="status" :class="{ bad: error }" x-show="error || !loaded" x-text="error || 'Loading…'" role="status"></p>
  <div class="session-msg" x-show="sessionMsg" :class="sessionMsg && (sessionMsg.ok ? 'ok' : 'bad')" role="status">
    <span x-text="sessionMsg && sessionMsg.text"></span>
    <ul x-show="sessionMsg && sessionMsg.details.length">
      <template x-for="d in (sessionMsg ? sessionMsg.details : [])" :key="d"><li x-text="d"></li></template>
    </ul>
    <button type="button" class="secondary" @click="sessionMsg = null">Close</button>
  </div>
  <div class="stale" x-show="stale" role="alert">
    <span x-text="stale"></span>
    <button type="button" @click="location.reload()" x-text="staleNewCode ? 'Reload' : 'Reload page'"></button>
    <button type="button" class="secondary" x-show="!staleNewCode" @click="stale = ''; version = null; checkVersion()">Dismiss</button>
  </div>
  <div class="col-main">

  <section class="gw-groups" aria-label="Gateways">
   <template x-for="grp in groupGateways(gateways, groupBy)" :key="grp.label">
   <div class="gw-group">
    <button type="button" class="group-head" x-show="groupBy !== 'none'" @click="toggleGroup(grp.label)"
            :aria-expanded="(!collapsed[grp.label]).toString()" :class="{ missing: grp.missing }">
      <span class="chev" x-text="collapsed[grp.label] ? '▸' : '▾'" aria-hidden="true"></span>
      <span x-text="grp.label"></span>
      <span class="count" x-text="grp.items.length + (grp.items.length === 1 ? ' gateway' : ' gateways')"></span>
    </button>
   <div class="cards" :class="{ compact: compact }" x-show="groupBy === 'none' || !collapsed[grp.label]">
    <template x-for="g in grp.items" :key="g.id">
      <button type="button" class="card" :aria-pressed="(g.id === active).toString()" @click="select(g.id)">
        <div class="top">
          <span class="id" x-text="g.id"></span>
          <span class="soc"><span x-text="pct(g.soc)" :aria-label="'state of charge ' + pct(g.soc)"></span>
            <small x-text="reserveText(g)"></small></span>
        </div>
        <div class="tz" x-text="localTimeText(g)"></div>
        <div class="fw" x-text="'Firmware ' + g.firmware"></div>
        <div class="addr">
          <div x-text="g.modbus_enabled ? 'Modbus TCP ' + addr(g.address) : 'Modbus TCP off'"
               :class="{ off: !g.modbus_enabled }"
               :title="g.modbus_enabled ? '' : 'Factory setup: enable with a Direct Connect 1205 sunsMdEn write'"></div>
          <div x-text="g.dc_address ? 'Direct Connect ' + addr(g.dc_address) : 'Direct Connect off'"
               :class="{ off: !g.dc_address }"
               :title="g.dc_address ? '' : 'No directconnect: entry for this gateway in the fleet file'"></div>
        </div>
        <dl class="flows">
          <div><dt>Solar</dt><dd x-text="kw(g.solar_w)"></dd></div>
          <div><dt>Home</dt><dd x-text="kw(g.load_w)"></dd></div>
          <div><dt>Battery</dt><dd x-text="kw(Math.abs(g.battery_w)) + batteryDir(g)"></dd></div>
          <div><dt>Grid</dt><dd x-text="kw(Math.abs(g.grid_w)) + gridDir(g)"></dd></div>
        </dl>
        <div class="tags">
          <span class="tag" :class="g.grid_connected ? 'ok' : 'bad'" x-text="gridState(g)"></span>
          <span class="tag" :class="modeClass(g)" x-text="g.native_mode_name"></span>
          <span class="tag" :class="statusClass(g)" x-text="g.run_status_name"></span>
          <span class="tag warn" x-show="g.force" x-text="g.force && ('FORCE · ' + g.force.direction)"
                title="A Modbus M704 setpoint is active. Direct Connect 1707 reads 9, which the FranklinWH app shows as VPP Mode."></span>
          <template x-for="a in g.alarm_names" :key="a"><span class="tag bad" x-text="a"></span></template>
          <template x-for="f in faultList(g)" :key="f"><span class="tag warn" x-text="'fault: ' + f"></span></template>
          <template x-for="o in overrideList(g)" :key="o"><span class="tag warn" x-text="o"></span></template>
          <span class="tag" x-show="g.episode_phase" x-text="'episode: ' + g.episode_phase"></span>
          <template x-for="n in g.apower_off" :key="'ap' + n"><span class="tag warn" x-text="'aPower ' + n + ' switched off'"></span></template>
          <span class="tag warn" x-show="g.battery_temperature && g.battery_temperature.derated"
                x-text="g.battery_temperature && ('derated: ' + g.battery_temperature.derated + ' · ' + fmtTemp(g.battery_temperature.battery_c, tempUnit))"
                title="Battery power limited by temperature"></span>
          <span class="tag bad" x-show="g.service && g.service.open" title="Grid import exceeded the main breaker's rating. Grid and phases → service, reset: true">main breaker tripped</span>
          <span class="tag warn" x-show="g.utility_rules && g.utility_rules.export === 'prohibited'">no export</span>
          <span class="tag warn" x-show="g.utility_rules && g.utility_rules.battery_export === false">no battery export</span>
          <span class="tag warn" x-show="g.debug_mode" title="Direct Connect 1821 enable 1: the battery is stopped">Debug Mode</span>
        </div>
      </button>
    </template>
   </div>
   </div>
   </template>
  </section>

  <section class="detail" x-show="current" aria-live="polite">
    <template x-if="current">
      <div>
        <div class="picker">
          <h2><label for="pick-gw" class="sr-only">Gateway</label>
            <select id="pick-gw" class="pick-gw" @change="select($event.target.value)">
              <template x-for="g in pickList()" :key="g.id"><option :value="g.id" :selected="g.id === active" x-text="pickLabel(g)"></option></template>
            </select></h2>
          <template x-for="[f, label] in PICK_FILTERS" :key="f">
            <span class="pick-filter" x-show="pickOptions(f).length > 1 || pickFilters[f]">
              <label :for="'pick-' + f" x-text="label"></label>
              <select :id="'pick-' + f" @change="setPickFilter(f, $event.target.value)">
                <option value="" :selected="!pickFilters[f]">any</option>
                <template x-for="v in pickOptions(f)" :key="v"><option :value="v" x-text="v" :selected="v === pickFilters[f]"></option></template>
              </select>
            </span>
          </template>
          <span class="sub pick-count" x-text="pickCount()"></span>
        </div>
        <div class="sub" x-text="detailLine(current)"></div>
        <div class="comms" x-show="current.profile !== 'spec'">
          <span class="comms-state" :class="{ off: !current.modbus_listening, warn: current.rebooting }" x-text="modbusText(current)"></span>
          <button type="button" x-show="current.dc_address" :disabled="busy === 'dc-modbus' || current.rebooting" @click="dcModbus(!current.modbus_enabled)"
                  :title="'Sends a Direct Connect 1205 sunsMdEn write to ' + addr(current.dc_address)"
                  x-text="busy === 'dc-modbus' ? 'Sending…' : (current.modbus_enabled ? 'Disable' : 'Enable') + ' Modbus TCP via Direct Connect'"></button>
          <button type="button" x-show="current.dc_address" :disabled="busy === 'dc-reboot' || current.rebooting" @click="dcReboot()"
                  :title="'Sends a Direct Connect 1721 reboot to ' + addr(current.dc_address)"
                  x-text="busy === 'dc-reboot' ? 'Sending…' : 'Reboot via Direct Connect'"></button>
          <span class="empty" x-show="!current.dc_address">No Direct Connect listener, so no 1205 write or 1721 reboot.</span>
          <template x-for="a in ['dc-modbus', 'dc-reboot']" :key="a">
            <p class="result" x-show="result(a)" :class="result(a) && (result(a).ok ? 'ok' : 'bad')"
               x-text="result(a) && result(a).text" role="status"></p>
          </template>
        </div>
        <div x-html="renderDiagram(current, tempUnit)"></div>
        <div class="grid2">
          <div>
            <h3>Grid</h3>
            <table>
              <tr><td>Voltage (mean L-N)</td><td x-text="current.v_ln.toFixed(1) + ' V'"></td></tr>
              <tr><td>Frequency</td><td x-text="current.hz.toFixed(2) + ' Hz'"></td></tr>
              <template x-for="(leg, name) in current.phases" :key="name">
                <tr><td x-text="name"></td><td x-text="leg.v_ln.toFixed(1) + ' V · ' + kw(leg.grid_w)"></td></tr>
              </template>
              <tr x-show="current.trip_reason"><td>Trip</td><td x-text="current.trip_reason + (current.trip_stage ? ' · ' + current.trip_stage : '')"></td></tr>
            </table>
          </div>
          <div>
            <h3>Smart circuits</h3>
            <table>
              <template x-for="(c, n) in current.circuits" :key="n">
                <tr><td x-text="n + ' · ' + c.name"></td><td x-text="(c.on ? 'on' : 'off') + ' · ' + kw(c.power_w)"></td></tr>
              </template>
            </table>
          </div>
          <div>
            <h3>Appliances</h3>
            <p class="empty" x-show="!Object.keys(current.appliances).length">None configured (built-in load curve).</p>
            <table x-show="Object.keys(current.appliances).length">
              <template x-for="(a, name) in current.appliances" :key="name">
                <tr><td x-text="name"></td><td x-text="kw(current.loads[name] || 0)"></td></tr>
              </template>
            </table>
          </div>
          <div>
            <h3>Generator</h3>
            <table>
              <tr><td>Fitted</td><td x-text="current.generator.installed ? 'yes' : 'no'"></td></tr>
              <tr x-show="current.generator.installed"><td>Output</td><td x-text="kw(current.generator_w)"></td></tr>
            </table>
          </div>
        </div>
        <div class="tou" x-show="schema">
          <div class="tou-head">
            <h3>TOU schedule <a class="help" :href="docsUrl('site-model/#tou-schedule')" target="_blank" rel="noopener" aria-label="TOU schedule docs">?</a></h3>
            <span class="tou-note" x-text="touNote(current)"></span>
            <button type="button" class="secondary" x-show="!touEditing()" @click="touEdit()">Edit</button>
          </div>
          <div class="timeline" role="img" :aria-label="touAria(current)">
            <div class="tl-row">
              <span class="tl-label">Dispatch</span>
              <div class="tl-bar">
                <template x-for="(s, i) in touSegments(current.tou.schedule)" :key="i">
                  <div class="tl-seg" :class="'d' + s.dispatchId" :style="'left:' + s.left + '%;width:' + s.width + '%'"
                       :title="s.from + '–' + s.to + ' · ' + s.name + ' · ' + s.dispatch + ' · ' + s.wave">
                    <span x-text="s.dispatch"></span></div>
                </template>
                <div class="tl-now" x-show="touNowPct(current.tou.active) !== null" :style="'left:' + touNowPct(current.tou.active) + '%'"></div>
              </div>
            </div>
            <div class="tl-row">
              <span class="tl-label">Tariff</span>
              <div class="tl-bar thin">
                <template x-for="(s, i) in touSegments(current.tou.schedule)" :key="i">
                  <div class="tl-seg" :class="'w' + s.waveType" :style="'left:' + s.left + '%;width:' + s.width + '%'"
                       :title="s.from + '–' + s.to + ' · ' + s.wave"><span x-text="s.wave"></span></div>
                </template>
              </div>
            </div>
            <div class="tl-hours" aria-hidden="true">
              <template x-for="h in [0, 3, 6, 9, 12, 15, 18, 21, 24]" :key="h">
                <span :style="'left:' + (h / 24 * 100) + '%'" x-text="String(h).padStart(2, '0')"></span>
              </template>
            </div>
          </div>
          <table x-show="!touEditing()">
            <tr class="th"><td>Time</td><td>Name</td><td>Dispatch</td><td>Tariff</td><td>Buy / sell</td></tr>
            <template x-for="(b, i) in current.tou.schedule" :key="i">
              <tr :class="{ now: b.startHourTime === current.tou.active.startHourTime }">
                <td x-text="b.startHourTime + '–' + b.endHourTime"></td>
                <td x-text="b.name + (b.filled ? ' (gap)' : '')"></td>
                <td x-text="b.dispatchId + ' ' + b.dispatch"></td>
                <td x-text="b.wave"></td>
                <td x-text="touPrice(current, b.waveType)"></td>
              </tr>
            </template>
          </table>
          <form class="tou-edit" x-show="touEditing()" @submit.prevent="touSend()" aria-label="Edit the TOU schedule">
            <template x-if="touEditing()">
              <div>
                <div class="tou-rows">
                  <div class="tou-row th" aria-hidden="true"><span>Start</span><span>End</span><span>Name</span><span>Dispatch</span><span>Tariff</span><span></span></div>
                  <template x-for="(r, i) in touDraftNow().rows" :key="i">
                    <div class="tou-row">
                      <input type="text" x-model="r.start" :aria-label="'Block ' + (i + 1) + ' start (HH:MM)'" inputmode="numeric" autocomplete="off">
                      <input type="text" x-model="r.end" :aria-label="'Block ' + (i + 1) + ' end (HH:MM)'" inputmode="numeric" autocomplete="off">
                      <input type="text" x-model="r.name" :aria-label="'Block ' + (i + 1) + ' name'" autocomplete="off">
                      <select x-model="r.dispatchId" :aria-label="'Block ' + (i + 1) + ' dispatch'">
                        <template x-for="[v, d] in Object.entries(schema.tou.dispatch)" :key="v">
                          <option :value="v" x-text="v + ' ' + d.code" :title="d.doc" :selected="v === r.dispatchId"></option>
                        </template>
                      </select>
                      <select x-model="r.waveType" :aria-label="'Block ' + (i + 1) + ' tariff'">
                        <template x-for="[v, n] in Object.entries(schema.tou.waves)" :key="v">
                          <option :value="v" x-text="n" :selected="v === r.waveType"></option>
                        </template>
                      </select>
                      <button type="button" class="secondary" @click="touDraftNow().rows.splice(i, 1)" :aria-label="'Remove block ' + (i + 1)">✕</button>
                      <small class="limits" x-show="touLimits(r.extra)" x-text="'kept, not applied: ' + touLimits(r.extra)"></small>
                    </div>
                  </template>
                </div>
                <button type="button" class="secondary" @click="touAddRow(touDraftNow())">Add block</button>
                <p class="hint">HH:MM, 00:00–24:00, no overlaps. Gaps run SELF, off-peak. Dispatch:
                  <template x-for="[v, d] in Object.entries(schema.tou.dispatch)" :key="v"><span x-text="d.code + ' = ' + d.doc + '. '"></span></template></p>
                <h4>Prices per tariff ($/kWh, shown only)</h4>
                <div class="tou-rates">
                  <template x-for="[w, n] in Object.entries(schema.tou.waves)" :key="w">
                    <div class="tou-rate">
                      <span x-text="n"></span>
                      <input type="text" inputmode="decimal" placeholder="buy" autocomplete="off" :aria-label="n + ' buy price'"
                             :value="touRate(w).buy" @input="touRate(w).buy = $event.target.value">
                      <input type="text" inputmode="decimal" placeholder="sell" autocomplete="off" :aria-label="n + ' sell price'"
                             :value="touRate(w).sell" @input="touRate(w).sell = $event.target.value">
                    </div>
                  </template>
                </div>
                <div class="tou-buttons">
                  <button type="button" class="secondary" @click="touCancel()">Cancel</button>
                  <button type="button" class="secondary" @click="touSend(true)">Reset to default</button>
                  <button type="submit" :disabled="busy === 'tou'" x-text="busy === 'tou' ? 'Sending…' : 'Send'"></button>
                </div>
              </div>
            </template>
          </form>
          <p class="result" x-show="result('tou-editor')" :class="result('tou-editor') && (result('tou-editor').ok ? 'ok' : 'bad')"
             x-text="result('tou-editor') && result('tou-editor').text" role="status"></p>
        </div>
        <details class="events" @toggle="eventsOpen = $event.target.open">
          <summary><span x-text="'Events (' + eventsFor().length + ')'"></span>
            <span class="sub">what this gateway did: mode, battery, grid, alarms, clients</span></summary>
          <p class="empty" x-show="events.level === 'off'">Off for this gateway (<code>events: off</code> in its fleet entry).</p>
          <p class="empty" x-show="events.level !== 'off' && !eventsFor().length">Nothing yet. Changes show here as the model runs.</p>
          <ul class="log">
            <template x-for="e in eventsFor().slice().reverse()" :key="e.seq"><li :class="'ev-' + e.kind" x-text="eventLine(e)"></li></template>
          </ul>
        </details>
      </div>
    </template>
  </section>
  </div>

  <section class="actions col-side" x-show="current && schema" aria-labelledby="actions-h">
    <div class="actions-top">
      <h2 id="actions-h"><label for="active-gw">Actions on</label></h2>
      <select id="active-gw" @change="select($event.target.value)">
        <!-- :selected per option, not :value on the select: the options render after `active` is
             set (from localStorage), so a select-level value would fall back to the first (#62) -->
        <template x-for="g in gateways" :key="g.id"><option :value="g.id" x-text="g.id" :selected="g.id === active"></option></template>
      </select>
    </div>
    <p class="sub">Each form sends only the fields you fill. The emulator checks them; its answer stays in the form.</p>
    <details class="group activity">
      <summary x-text="'Activity (' + log.length + ' actions this run)'"></summary>
      <p class="empty" x-show="!log.length">Nothing yet. Every action from this page, ctl, the API or a restore shows here.</p>
      <ol class="log">
        <template x-for="(e, i) in recentLog()" :key="i"><li :class="{ bad: !e.ok }" x-text="logLine(e)"></li></template>
      </ol>
    </details>
    <details class="group monitor" @toggle="setMonitor($event.target.open)">
      <summary>Monitor <span class="sub" x-show="mon" x-text="mon && monTotals(mon)"></span></summary>
      <p class="empty" x-show="!mon">Loading…</p>
      <template x-if="mon">
        <div class="mon">
          <p class="mon-line" x-text="monProcess(mon.process)"></p>
          <table class="mon-table">
            <thead><tr><th scope="col">Gateway</th><th scope="col">Modbus TCP clients</th><th scope="col">Direct Connect clients</th></tr></thead>
            <tbody>
              <template x-for="r in mon.gateways" :key="r.id">
                <tr :class="{ cur: r.id === active }">
                  <th scope="row"><button type="button" class="linkish" @click="select(r.id)" x-text="r.id"></button></th>
                  <td x-text="monListener(r.modbus)"></td>
                  <td x-text="monListener(r.dc)"></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </template>
    </details>
    <template x-for="group in groupNames()" :key="group">
      <details class="group">
        <summary><span x-text="group"></span> <a class="help" :href="docsUrl(groupDocs(group))" target="_blank" rel="noopener"
             :aria-label="group + ' docs'" @click.stop>?</a></summary>
        <div class="forms">
          <template x-for="name in actionsIn(group)" :key="name">
            <form class="action" @submit.prevent="submit(name)">
              <div class="action-head">
                <h3 x-text="name"></h3>
                <label class="example" x-show="action(name).examples.length">
                  <span>Example</span>
                  <select @change="fillExample(name, $event.target.value); $event.target.value = ''">
                    <option value="">fill from…</option>
                    <template x-for="(ex, i) in action(name).examples" :key="i">
                      <option :value="i" x-text="JSON.stringify(ex)"></option>
                    </template>
                  </select>
                </label>
              </div>
              <p class="doc" x-text="action(name).doc"></p>
              <template x-for="[field, spec] in fieldsOf(name)" :key="field">
                <div class="field">
                  <label :for="fieldId(name, field)">
                    <span x-text="field"></span><span class="req" x-show="required(name, field)" aria-label="required"> *</span>
                  </label>
                  <template x-if="kind(spec) === 'choice'">
                    <select :id="fieldId(name, field)" x-model="forms[name][field]">
                      <template x-for="[v, l] in options(spec)" :key="v"><option :value="v" x-text="l"></option></template>
                    </select>
                  </template>
                  <template x-if="kind(spec) === 'json'">
                    <textarea :id="fieldId(name, field)" rows="2" x-model="forms[name][field]" placeholder="{ }"></textarea>
                  </template>
                  <template x-if="kind(spec) === 'number' || kind(spec) === 'text' || kind(spec) === 'list'">
                    <input :id="fieldId(name, field)" type="text" x-model="forms[name][field]"
                           :inputmode="kind(spec) === 'number' ? 'decimal' : 'text'" autocomplete="off">
                  </template>
                  <small x-text="hint(spec)"></small>
                </div>
              </template>
              <div class="submit">
                <button type="submit" :disabled="busy === name" x-text="busy === name ? 'Sending…' : 'Send'"></button>
              </div>
              <p class="result" x-show="result(name)" :class="result(name) && (result(name).ok ? 'ok' : 'bad')"
                 x-text="result(name) && result(name).text" role="status"></p>
            </form>
          </template>
        </div>
      </details>
    </template>
  </section>
</main>
</body>
</html>
