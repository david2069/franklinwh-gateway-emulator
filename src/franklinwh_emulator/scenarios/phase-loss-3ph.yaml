name: phase-loss-3ph
description: >
  A three-phase Australian home, one single-phase aGate per phase (the AU aGate is single
  phase), loses L2. The aGate on L2 islands at once and carries its phase's load from its
  battery; the aGates on L1 and L3 stay on the grid. L2's aGate reconnects 60 s after the
  grid is healthy again.
start: "2026-01-15T20:00:00"
duration: 10m
record_every: 5s
fleet:
  groups:
    au3: {seed: 11, location: {latitude: -33.87, longitude: 151.21, timezone: Australia/Sydney, postcode: "2000"}}
  gateways:
    - {id: au3-l1, group: au3, phases: [L1], seed: 11, initial_soc: 70}
    - {id: au3-l2, group: au3, phases: [L2], seed: 13, initial_soc: 70, solar_peak_w: 0}
    - {id: au3-l3, group: au3, phases: [L3], seed: 14, initial_soc: 70, solar_peak_w: 0}
steps:
  - {at: 0,   do: load, with: {w: 1500}, gateway: au3-l2}
  - {at: 1m,  do: grid, with: {available: false, phase: L2}, gateway: au3-l1}
  - {at: 1m,  gateway: au3-l2, expect: {grid_connected: false, grid_w: 0, battery_w: "~1500"}}
  - {at: 1m,  gateway: au3-l1, expect: {grid_connected: true}}
  - {at: 1m,  gateway: au3-l3, expect: {grid_connected: true}}
  - {at: 5m,  do: grid, with: {restore: true}, gateway: au3-l3}
  - {at: 5m59s, gateway: au3-l2, expect: {grid_connected: false}}
  - {at: 6m1s, gateway: au3-l2, expect: {grid_connected: true}}
