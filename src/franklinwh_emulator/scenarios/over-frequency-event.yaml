name: over-frequency-event
description: >
  Australia A frequency-watt on a high-frequency event. At 50.75 Hz battery discharge stops
  (f_transition) and PV is curtailed. At 51.5 Hz storage charges at least half its rating. At
  52.5 Hz the F> stage trips within 0.2 s.
start: "2026-01-15T13:00:00"
duration: 10m
record_every: 1s
fleet:
  gateways:
    - {id: home, seed: 7, grid_code: ausgrid, location: {latitude: -33.87, longitude: 151.21, timezone: Australia/Sydney, postcode: "2000"}, initial_soc: 50}
steps:
  - {at: 0,   do: pv,   with: {solar_w: 3500}}
  - {at: 0,   do: load, with: {w: 4000}}
  - {at: 10s, expect: {battery_w: "~500"}}
  - {at: 1m,  do: grid, with: {hz: 50.75}}
  # AS4777 timing: nothing for up to 1 s (dead time), settled within 10 s.
  - {at: 1m500ms, expect: {battery_w: "~500", solar_w: "~3500"}}
  - {at: 1m15s, expect: {battery_w: "<=10", solar_w: "~2500", inverter_state: 4}}
  - {at: 2m,  do: grid, with: {hz: 51.5}}
  - {at: 2m15s, expect: {battery_w: "<=-2500"}}
  - {at: 3m,  do: grid, with: {hz: 52.5}}
  - {at: 3m1s, expect: {grid_connected: false, trip_stage: "F>"}}
