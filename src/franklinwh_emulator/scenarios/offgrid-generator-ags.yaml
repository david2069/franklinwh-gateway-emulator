name: offgrid-generator-ags
description: >
  A night-time black-out on a low battery with a 7 kW generator on AGS (start at or below 20 %,
  stop at 30 %). On-grid the battery stops at its 20 % reserve; when the grid goes it is at the
  start threshold, so the generator cranks at once (startDelTime is the app's "Alarm delay after
  starting fails", not a start delay: #179), warms up, carries the house and charges the
  battery at its 70 % optimal point, and stops at 30 % after its minimum run. The grid returns
  while it runs again: it hands back and cools down. Nothing starts on-grid.
start: "2026-07-10T01:00:00"
duration: 4h
record_every: 10s
fleet:
  gateways:
    - id: home
      seed: 7
      grid_code: ausgrid
      location: {latitude: -33.87, longitude: 151.21, timezone: Australia/Sydney}
      initial_soc: 22
      generator: {installed: true, rated_w: 7000, genStartElec: 20, genCloseElec: 30,
                  charge1En: 0, min_run_s: 900}
steps:
  - {at: 0,    do: load, with: {w: 1200}}
  - {at: 10m,  expect: {gen_state: 0, generator_w: 0}}           # on-grid: never starts
  - {at: 15m,  do: grid, with: {available: false}}
  - {at: 20m,  expect: {grid_connected: false, gen_state: 1}}    # at the 20 % reserve: starts at once
  - {at: 25m,  expect: {gen_state: 1, generator_w: ">4000"}}      # cranked, warmed up, loaded
  - {at: 25m,  expect: {battery_w: "<-3000"}}                     # charging at the 70 % point
  - {at: 50m,  expect: {gen_state: 0, generator_w: 0}}            # stopped at 30 %, cooled down
  - {at: 2h,   expect: {gen_state: 1}}                            # back at 20 %: starts again
  - {at: 2h50m, do: soc, with: {value: 15}}
  - {at: 3h5m, expect: {gen_state: 1, generator_w: ">4000"}}
  - {at: 3h10m, do: grid, with: {restore: true}}
  - {at: 3h12m, expect: {grid_connected: true, generator_w: 0, gen_state: 2}}
  - {at: 3h20m, expect: {gen_state: 0}}
