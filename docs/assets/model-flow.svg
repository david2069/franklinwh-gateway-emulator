<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" width="1040" height="600" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<title id="t">How the inputs drive the emulator's site model</title>
<desc id="d">Location, weather, placement, controls and grid feed sun position, sunlight, outside air and cabinet temperature; these set PV output, home load, battery limits and the battery target; the site balance combines them into the outputs served over Modbus TCP, Direct Connect and the UI. Battery power heats the cabinet.</desc>
