<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 800" width="1060" height="800" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<title id="t">How the inputs drive the emulator's site model</title>
<desc id="d">Location, weather, placement, controls, the grid code, utility limits and the service breaker feed sun position, sunlight, outside air and cabinet temperature; these set PV output, home load, battery limits, the battery target and grid limits; the site balance combines them into the outputs served over Modbus TCP, Direct Connect and the UI. Battery power heats the cabinet. Dashed boxes are planned.</desc>
