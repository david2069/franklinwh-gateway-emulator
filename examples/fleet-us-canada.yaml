    tou_rates: {4: {buy: 0.06, sell: 0.04}, 0: {buy: 0.11, sell: 0.06}, 2: {buy: 0.31, sell: 0.18}}   # $/kWh, shown only
    pv_inputs: {proximal: 0.7, remote1: 0.3}
    solar_peak_w: 14000
    utility: {battery_export: true}
    loads:
