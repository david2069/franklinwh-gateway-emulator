    solar_peak_w: 0
    generator: {installed: true, rated_w: 12000}
    utility: {grid_charge: false}
    accessories: {smart_circuits: false}
    loads:
      - {name: base, type: base, w: 400, drift: 0.15}
      - {name: fridge, type: cycle, w: 150, period: 40m, duty: 0.35}
      - {name: well_pump, type: cycle, w: 1100, period: 30m, duty: 0.15}
    location: {postcode: "96003", latitude: 40.59, longitude: -122.39, timezone: America/Los_Angeles,
