      - {name: On-Peak, startHourTime: "18:00", endHourTime: "21:00", waveType: 2, dispatchId: 1}
      - {name: Off-Peak, startHourTime: "21:00", endHourTime: "24:00", waveType: 0, dispatchId: 6}
    tou_rates: {0: {buy: 0.11, sell: 0.04}, 2: {buy: 0.29, sell: 0.04}}   # $/kWh, shown only
    v2l: {circuit: 1, ev_kwh: 82, ev_soc: 80, max_w: 7600, min_soc: 20}   # EV values: placeholders (#287)
    utility: {battery_export: true}
    loads:
      - {name: base, type: base, w: 400, drift: 0.15}
      - {name: fridge, type: cycle, w: 150, period: 40m, duty: 0.35}
      - {name: pool_pump, type: schedule, w: 1500, on: ["09:00-15:00"], circuit: 2}
    location: {postcode: "33606", latitude: 27.95, longitude: -82.46, timezone: America/New_York,
