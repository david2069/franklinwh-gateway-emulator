# franklinwh-emulator fleet ./examples/fleet.yaml
#
# Every key outside `gateways` is optional. Per gateway:
#   id, seed, serial, host, port (or modbus: {host, port}), directconnect: {port} (every aGate
#   runs one; a free port if not given), setup (factory: Modbus TCP off until a Direct Connect
#   1205 write enables it; in-service: Modbus TCP on), modbus_enabled, commissioned (YYYY-MM-DD),
#   history_days (in-service: run the model over N days before start; ~0.2 s/day), profile, quirks,
#   time_scale, and any site setting:
#     group (a `groups:` site, one aGate per phase), apower_units, ac_type (0 single,
#     1 split, 2 three: not on AU/NZ aGates, which are single phase), phases ([L1, L2, ...]),
#     load_split / gen_split ({L1: 2, L2: 1}), grid_code (as4777-au-a, ieee1547-cat2,
#     ieee1547-cat3, ausgrid), grid_overrides ({es_delay_s: 5, ...}),
#     location ({latitude, longitude, timezone: <IANA, DST-aware>, postcode}), weather_events, weather
#     ({model: bell|synthetic|open-meteo, kwp, tilt, azimuth, sky} — inherits lat/lon),
#     tz_offset_hours (fixed offset, no DST; location.timezone wins),
#     native_mode (Modbus 15507 numbering: 1 Emergency Backup, 2 Self-Consumption, 3 TOU;
#     Direct Connect and the cloud number them differently), self_reserve, tou_reserve,
#     initial_soc, solar_peak_w, home_base_w, pv_inputs ({proximal: 0.6, remote1: 0.4}),
#     offgrid_floor_soc.
# cloud: {account, password}: the FranklinWH Cloud API's account (with --cloud-port; default
#   owner@example.com / emulator). Every gateway here belongs to it (#297).
defaults:
  host: 127.0.0.1
  setup: in-service          # already set up, Modbus TCP on; `fresh` below is a factory aGate

# Sites with one aGate per phase (#241): what the aGates share, per group.
groups:
  au-3phase:
    seed: 11
    location: {latitude: -37.81, longitude: 144.96, timezone: Australia/Melbourne,
               country: AU, state: VIC, city: Melbourne}
    service: {main_breaker_a: 63}   # per phase
  au-2phase:
    seed: 12
    location: {latitude: -34.93, longitude: 138.60, timezone: Australia/Adelaide,
               country: AU, state: SA, city: Adelaide}
    service: {main_breaker_a: 63}

gateways:
  # Sydney single-phase home on Ausgrid (the reference aGate): Australia A + 10 kW export.
  - id: site
    seed: 7
    apower_units: 2
    grid_code: ausgrid
    location: {latitude: -33.87, longitude: 151.21, timezone: Australia/Sydney, postcode: "2000",
               country: AU, state: NSW, city: Sydney, site_id: demo-sydney}
    weather: {model: synthetic, kwp: 6.6, tilt: 20, sky: broken}
    weather_events:          # darker skies on top of the weather (#270)
      - {sky: storm, at: "15:00", for: 1h, every: 1d, times: 2}   # 15:00-16:00, the first two days
      - {sky: overcast, for: 30m..2h, chance: 0.3, per: day}      # random, from the seed
    install: {outdoor: {sun: afternoon, cover: roof}}   # cabinet temperature (#110)
    loads: sydney-family     # appliances on smart circuits 1-3 (hot water, EV, aircon)
    history_days: 7          # a week of Direct Connect history and totals, run at start-up
    service: {main_breaker_a: 63}   # service rating: 63 A x 230 V = 14.5 kW; import above it trips (#123)
    modbus: {port: 5020}
    directconnect: {port: 9020}

  # US split-phase 120/240 V, IEEE 1547-2018 Category II.
  - id: us-split
    seed: 42
    ac_type: 1
    location: {latitude: 33.45, longitude: -112.07, timezone: America/Phoenix,
               country: US, state: AZ, city: Phoenix}
    service: {main_breaker_a: 200}
    modbus: {port: 5021}
    directconnect: {port: 9021}

  # Melbourne three-phase home: the AU aGate is single phase, so one aGate per phase in the
  # au-3phase group (#241, #242), as board E of the design (#285):
  #   L1: solar (remote PV through an aPbox), no smart circuits; most of the house
  #   L2: aircon and hot water + induction on smart circuits 1 and 2
  #   L3: the EV on smart circuit 1 with V2L (through the generator input and the smart
  #       circuits): it charges on-grid and supplies the home off-grid (#287); circuit 2 unused
  - id: au-3phase-l1
    group: au-3phase
    phases: [L1]
    seed: 11
    install: {indoor: unheated}   # a garage: lags the outside air
    home_base_w: 600
    pv_inputs: {proximal: 0.6, remote1: 0.4}
    accessories: {smart_circuits: false}
    modbus: {port: 5022}
    directconnect: {port: 9022}
  - id: au-3phase-l2
    group: au-3phase
    phases: [L2]
    seed: 111
    install: {indoor: unheated}
    solar_peak_w: 0
    loads:
      - {name: base, type: base, w: 200, drift: 0.1}
      - {name: aircon, type: hvac, w: 2400, cool_above: 26, heat_below: 15, span: 8,
         on: ["07:00-23:00"], circuit: 1}
      - {name: hot_water, type: schedule, w: 3600, on: ["11:00-13:30"], circuit: 2}
      - {name: induction, type: events, w: 2400, duration: 30m, per_day: 1,
         windows: ["17:30-19:00"], circuit: 2}
    modbus: {port: 5030}
    directconnect: {port: 9030}
  - id: au-3phase-l3
    group: au-3phase
    phases: [L3]
    seed: 112
    install: {indoor: unheated}
    solar_peak_w: 0
    accessories: {smart_circuits: true, generator_module: true}   # what V2L needs
    v2l: {circuit: 1, ev_kwh: 60, ev_soc: 80, max_w: 2200, min_soc: 20}   # EV values: placeholders (#287)
    loads:
      - {name: base, type: base, w: 200, drift: 0.1}
      - {name: ev, type: ev, w: 7000, min_w: 1400, arrive: "18:00", depart: "07:30", kwh: 18,
         mode: offpeak, start: "22:00", circuit: 1}
    modbus: {port: 5031}
    directconnect: {port: 9031}

  # Two legs of a three-phase supply in Adelaide (UTC+9:30/+10:30): one aGate on each.
  - id: au-2phase-l1
    group: au-2phase
    phases: [L1]
    seed: 12
    modbus: {port: 5023}
    directconnect: {port: 9023}
  - id: au-2phase-l2
    group: au-2phase
    phases: [L2]
    seed: 121
    solar_peak_w: 0
    modbus: {port: 5032}
    directconnect: {port: 9032}

  # 15509 holds the TOU reserve instead of repeating 15508.
  - id: tou-reserve
    seed: 99
    quirks:
      tou_reserve_mirrors_self: false
    service: {main_breaker_a: 63}
    modbus: {port: 5024}
    directconnect: {port: 9024}

  # Fresh from the installer: Modbus TCP is off until a Direct Connect 1205 sunsMdEn write
  # (the UI's "Enable Modbus TCP", or a Direct Connect client) turns it on.
  - id: fresh
    seed: 21
    setup: factory
    location: {latitude: -33.87, longitude: 151.21, timezone: Australia/Sydney,
               country: AU, state: NSW, city: Sydney}
    service: {main_breaker_a: 63}
    modbus: {port: 5026}
    directconnect: {port: 9026}

  # A spec-compliant SunSpec DER on Rule 21-style Category III ride-through (not an aGate: no
  # Direct Connect, Modbus TCP on).
  - id: spec
    seed: 3
    profile: spec
    ac_type: 1
    grid_code: ieee1547-cat3
    service: {main_breaker_a: 200}
    modbus: {port: 5025}
